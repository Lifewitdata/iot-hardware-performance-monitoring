name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 16 is the image docker-compose.yml targets; it had never
        # been executed before, so CI runs it here.
        image: postgres:16
        env:
          POSTGRES_USER: metropt
          POSTGRES_PASSWORD: metropt
          POSTGRES_DB: metropt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metropt -d metropt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://metropt:metropt@localhost:5432/metropt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Lint (correctness rules: E9, F)
        run: ruff check .

      - name: Test suite (includes the live PostgreSQL integration test)
        run: pytest -q

      - name: Verify the package installs and imports
        run: |
          python -m pip install -e .
          python -c "import src.config, ingestion.load_sensor_data; print('package imports OK')"
