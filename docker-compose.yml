services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: metropt
      POSTGRES_USER: metropt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - metropt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metropt -d metropt"]
      interval: 5s
      retries: 10
volumes:
  metropt_pg:
